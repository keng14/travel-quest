<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2a9d8f">
<title>Travel Quest - เกมสะสมเหรียญการเดินทาง</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2a9d8f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Travel Quest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{--bg:#f3f7f6;--card:#fff;--ink:#1d2b2a;--muted:#5d6e6b;--brand:#2a9d8f;--brand2:#6d5ce6;--line:#dbe6e3;--ok:#1f8f55;--gold:#f5b82e;--warn:#c4283f;--ring:#6d5ce6;--safe-b:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
body{font-family:'Sarabun',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;-webkit-tap-highlight-color:transparent;line-height:1.5}
body.noscroll{overflow:hidden}
header{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;position:sticky;top:0;z-index:10;box-shadow:0 2px 12px rgba(42,157,143,.25);padding-top:env(safe-area-inset-top,0px)}
.hbar{max-width:1100px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
header h1{margin:0;font-size:20px;font-weight:800;line-height:1.2}
header .sub{opacity:.92;font-size:13px}
.langbtn{margin-left:auto;background:rgba(255,255,255,.18);color:#fff;border:1.5px solid rgba(255,255,255,.6);border-radius:999px;min-height:40px;min-width:64px;padding:6px 14px;font:inherit;font-weight:800;cursor:pointer}
.langbtn:hover{background:rgba(255,255,255,.28)}
main{max-width:1100px;margin:0 auto;padding:16px 16px calc(110px + var(--safe-b))}
.narrow{max-width:520px;margin:0 auto}
.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 2px 10px rgba(0,0,0,.06);margin-bottom:12px}
h2{margin:0 0 6px;font-size:19px}
h3{margin:0;font-size:16px}
.muted{color:var(--muted);font-size:13px}
.err{color:var(--warn);font-size:14px;min-height:20px;margin:6px 0 0}
label,.lbl{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
input,textarea{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);min-height:46px}
textarea{min-height:76px;resize:vertical}
input:focus-visible,textarea:focus-visible{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(42,157,143,.2)}
:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
button{font-family:inherit;color:inherit}
.btn{font:inherit;font-weight:700;border:0;border-radius:12px;min-height:46px;padding:11px 18px;background:var(--brand);color:#fff;cursor:pointer;font-size:15px;transition:transform .15s ease,filter .15s ease}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:#eef4f3;color:var(--ink)}
.btn.danger{background:var(--warn)}
.btn.small{min-height:44px;padding:8px 14px;font-size:14px;white-space:nowrap}
.btn.wide{width:100%;margin-top:14px}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1;min-width:0}
.wrap{flex-wrap:wrap}
.dates{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.iconbtn{border:0;background:#f1f5f4;border-radius:999px;min-width:44px;min-height:44px;font-size:18px;cursor:pointer}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:-4px 0 12px}
.toolbar .btn{flex:1 1 auto}

/* guide */
details.guide summary{cursor:pointer;font-weight:800;list-style:none;display:flex;align-items:center;gap:8px;min-height:32px}
details.guide summary::-webkit-details-marker{display:none}
details.guide summary::after{content:'▾';margin-left:auto;color:var(--muted)}
details.guide[open] summary::after{content:'▴'}
.steps{margin:10px 0 0;padding-left:22px}
.steps li{margin:4px 0}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.legend span{background:#f1f5f4;border-radius:999px;padding:4px 10px;font-size:13px}

/* plan */
.daygrid{display:grid;gap:10px}
@media(min-width:700px){.daygrid{grid-template-columns:1fr 1fr}}
@media(min-width:1000px){.daygrid{grid-template-columns:1fr 1fr 1fr}}
.daycard{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:#fff;border:2px solid transparent;border-radius:16px;padding:14px;box-shadow:0 2px 10px rgba(0,0,0,.06);cursor:pointer;font:inherit;min-height:84px;transition:border-color .15s ease,transform .15s ease}
.daycard:hover{border-color:var(--brand)}
.daycard:active{transform:scale(.99)}
.daycard.empty{border-color:#f2c7cf;background:#fffafb}
.daycard .chips{display:block;margin-top:4px;font-size:18px;letter-spacing:2px;min-height:24px}
.count{flex:0 0 auto;font-weight:800;color:var(--brand);background:#e7f5f2;border-radius:999px;padding:4px 10px;font-size:14px}
.daycard.empty .count{color:var(--warn);background:#fde8ec}
.editlbl{display:block;font-size:12px;color:var(--brand);font-weight:700;margin-top:2px}
.startbar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);box-shadow:0 -2px 12px rgba(0,0,0,.08);z-index:9;padding:10px 16px calc(10px + var(--safe-b))}
.startbar .in{max-width:1100px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.startbar .err{flex:1 1 220px;margin:0}

/* play */
.play-grid{display:grid;gap:12px}
@media(min-width:900px){.play-grid{grid-template-columns:420px 1fr;align-items:start}.play-side{position:sticky;top:84px}}
.bar{height:12px;background:#dfeae8;border-radius:999px;overflow:hidden;margin:10px 0 4px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));transition:width .6s ease}
.bar>i.full{background:var(--ok)}
.champion{text-align:center;background:linear-gradient(135deg,#fff7de,#ffffff);border:2px solid var(--gold)}
.champion .cup{font-size:44px;line-height:1}
.stagebtn{display:flex;gap:12px;align-items:center;width:100%;min-height:56px;background:none;border:0;padding:0;text-align:left;font:inherit;cursor:pointer}
.badge{flex:0 0 42px;height:42px;border-radius:50%;background:#eef4f3;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px}
.badge.cur{background:var(--brand);color:#fff;box-shadow:0 0 0 4px rgba(42,157,143,.2)}
.badge.ok{background:var(--gold);color:#fff;box-shadow:0 0 0 4px rgba(245,184,46,.25)}
.stage.current{outline:2px solid var(--brand)}
.items{margin-top:12px;border-top:1px solid var(--line);padding-top:6px}
.item{display:flex;align-items:center;gap:4px}
.item label{margin:0;font-weight:400;font-size:15px;display:flex;gap:10px;align-items:center;flex:1;cursor:pointer;min-height:46px;padding:4px 0}
.item input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--brand);flex:0 0 auto;margin:0}
.ci{font-size:18px;flex:0 0 auto}
.done{text-decoration:line-through;color:var(--muted)}
.x{border:0;background:none;color:#7b8a87;font-size:17px;cursor:pointer;min-width:44px;min-height:44px;border-radius:999px}
.x:hover{background:#f1f5f4;color:var(--warn)}
.art{width:100%;height:auto;border-radius:14px;display:block;margin:10px 0 2px}
.thumbs{display:flex;gap:6px;margin-top:8px;overflow-x:auto}
.thumbs img{width:56px;height:56px;border-radius:10px;object-fit:cover;flex:0 0 auto}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin-top:8px}
.photos .ph{position:relative}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;display:block}
.photos .x{position:absolute;top:2px;right:2px;background:rgba(255,255,255,.9);border-radius:999px;min-width:36px;min-height:36px}
.addphoto{display:flex;align-items:center;justify-content:center;min-height:88px;border:2px dashed var(--brand);border-radius:12px;color:var(--brand);font-weight:700;cursor:pointer;background:#f6fbfa}
.addphoto input{display:none}
.addphoto.disabled{opacity:.5;cursor:default}
.field{margin-top:12px}

/* modal */
.modal{position:fixed;inset:0;background:rgba(20,30,30,.45);display:flex;align-items:flex-end;justify-content:center;z-index:40}
.modal.center{align-items:center;padding:16px}
.sheet{background:#fff;width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + var(--safe-b));animation:up .25s ease-out}
.modal.center .sheet{border-radius:22px;max-width:380px;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.modal.wide .sheet{max-width:640px}
@media(min-width:700px){.modal{align-items:center;padding:16px}.sheet{border-radius:22px}}
.sheet-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:4px}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cat{display:flex;flex-direction:column;align-items:center;gap:2px;background:#f6f9f8;border:2px solid transparent;border-radius:14px;padding:8px 4px;min-height:64px;cursor:pointer;font:inherit;font-size:13px;font-weight:600}
.cat .ci{font-size:24px}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;scroll-behavior:auto !important}
}
.cat.on{border-color:var(--brand);background:#e7f5f2}
.sugs{display:flex;flex-wrap:wrap;gap:8px}
.sug{border:1.5px dashed var(--brand);background:#fff;color:var(--brand);border-radius:999px;min-height:40px;padding:6px 14px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.sug:hover{background:#e7f5f2}
.elist .item{border-bottom:1px solid var(--line);padding:4px 0;gap:10px}
.elist .item .t{flex:1;min-width:0}
.pop{text-align:center}
.pop h2{font-size:20px;margin:6px 0}
.coin{width:120px;height:120px;margin:4px auto;display:block;animation:bob 1s infinite alternate}
.stars{font-size:20px;letter-spacing:3px;margin:6px 0}

/* infographic */
.modal.ig .sheet{max-width:680px;padding:0;overflow-x:hidden;background:#fbf8ff}
.ig{--pk:#c2185b;font-size:15px}
.ig-hero{position:relative;color:#fff;padding:22px 20px 20px;background:linear-gradient(160deg,#2a9d8f 0%,#4f7fd8 55%,#6d5ce6 100%);overflow:hidden}
.ig-hero svg.sky{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.ig-hero>*{position:relative}
.ig-tag{display:inline-block;background:#ffd45e;color:#3b2a00;font-weight:800;font-size:12px;letter-spacing:.08em;padding:4px 10px;border-radius:999px;transform:rotate(-2deg)}
.ig-title{font-size:clamp(26px,7vw,38px);font-weight:800;line-height:1.1;margin:10px 0 4px;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.15);word-break:break-word}
.ig-dates{font-weight:600;opacity:.95}
.ig-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.ig-stat{background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.45);border-radius:14px;padding:8px;text-align:center;backdrop-filter:blur(4px)}
.ig-stat b{display:block;font-size:24px;line-height:1.1}
.ig-stat span{font-size:12px;opacity:.95}
.ig-xp{margin-top:14px;background:rgba(0,0,0,.18);border-radius:999px;height:14px;overflow:hidden;border:2px solid rgba(255,255,255,.55)}
.ig-xp i{display:block;height:100%;background:repeating-linear-gradient(45deg,#ffd45e 0 10px,#ffc21f 10px 20px)}
.ig-xpl{display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin-top:4px}
.ig-loot{display:flex;flex-wrap:wrap;gap:6px;padding:14px 16px 2px}
.ig-loot span{display:inline-flex;align-items:center;gap:4px;background:#fff;border:1.5px solid #e6def8;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:700;color:#3d3566}
.ig-loot .ico{width:16px;height:16px;color:#6d5ce6}
.ig-path{position:relative;padding:14px 16px 6px 16px}
.ig-path::before{content:'';position:absolute;left:37px;top:24px;bottom:24px;border-left:4px dotted #c9bdf0}
.ig-stop{position:relative;display:flex;gap:12px;margin-bottom:16px}
.ig-node{flex:0 0 46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:#fff;background:var(--ac);box-shadow:0 0 0 4px #fbf8ff,0 4px 10px rgba(0,0,0,.15);z-index:1}
.ig-node svg{width:46px;height:46px}
.ig-node .ico{width:22px;height:22px;color:#fff}
.ig-card{flex:1;min-width:0;background:var(--bg);border-radius:18px;padding:12px 14px;box-shadow:0 3px 0 rgba(0,0,0,.06),0 6px 16px rgba(60,40,120,.08);border:2px solid #fff}
.ig-top{display:flex;gap:10px;align-items:flex-start}
.ig-head{flex:1;min-width:0}
.ig-chip{display:inline-block;background:var(--ac);color:#fff;font-weight:800;font-size:12px;letter-spacing:.04em;padding:3px 10px;border-radius:999px}
.ig-card h3{margin:6px 0 0;font-size:17px;color:#1d1b2e}
.ig-date{font-size:13px;color:#4d4866}
.ig-thumb{flex:0 0 84px;width:84px;height:50px;border-radius:10px;overflow:hidden;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.ig-thumb .art{width:100%;height:100%;display:block;margin:0;border-radius:0}
.ig-place{display:inline-flex;align-items:center;gap:4px;margin-top:8px;background:#fff;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700;color:var(--ac)}
.ig-list{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:4px}
.ig-list li{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.7);border-radius:10px;padding:5px 8px;font-size:14px}
.ig-list .ico{width:18px;height:18px;color:var(--ac)}
.ig-list .ck{margin-left:auto;flex:0 0 20px;height:20px;border-radius:6px;border:2px solid var(--ac);display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff}
.ig-list .ck.on{background:var(--ac)}
.ig-list .t{flex:1;min-width:0}
.ig-list .t.done{text-decoration:line-through;color:#6f6a86}
.ig-empty{font-size:13px;color:#6f6a86;margin-top:8px}
.ig-extra{display:flex;gap:10px;align-items:flex-start;margin-top:10px;flex-wrap:wrap}
.ig-note{flex:1 1 160px;background:#fff3a8;padding:8px 10px 10px;border-radius:3px;font-size:13px;color:#4a3f00;box-shadow:0 3px 8px rgba(0,0,0,.12);transform:rotate(-1.2deg);position:relative}
.ig-note::before{content:'';position:absolute;top:-7px;left:50%;width:44px;height:14px;margin-left:-22px;background:rgba(255,255,255,.65);transform:rotate(2deg)}
.ig-pol{background:#fff;padding:5px 5px 14px;box-shadow:0 3px 8px rgba(0,0,0,.15);transform:rotate(2deg);flex:0 0 auto}
.ig-pol img{width:88px;height:88px;object-fit:cover;display:block}
.ig-end{margin:4px 16px 16px;border-radius:20px;padding:16px;text-align:center;background:linear-gradient(135deg,#fff3cf,#ffe2b8);border:2px dashed #e5a50a}
.ig-end .coin{width:64px;height:64px}
.ig-end h3{margin:4px 0 2px;color:#5a3d00}
.ig-coins{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;margin-top:8px}
.ig-coins i{width:22px;height:22px;border-radius:50%;background:#e9e2d4;box-shadow:inset 0 -2px 0 rgba(0,0,0,.08)}
.ig-coins i.on{background:radial-gradient(circle at 40% 35%,#ffe08a 0 45%,#f5b82e 46%)}
.ig-actions{padding:0 16px 16px}
.ig-chiprow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ig-complete{display:inline-block;background:#1f8f55;color:#fff;font-weight:800;font-size:12px;letter-spacing:.06em;padding:3px 10px;border-radius:999px}
.start-big{width:100%;min-height:72px;font-size:24px;font-weight:800;letter-spacing:.02em;border-radius:22px;background:linear-gradient(135deg,#2a9d8f 0%,#6d5ce6 100%);color:#fff;box-shadow:0 10px 24px rgba(109,92,230,.38);animation:startPulse 1.8s ease-in-out infinite}
.start-big:hover{filter:brightness(1.05)}
@keyframes startPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
@media(min-width:600px){.ig-thumb{flex-basis:112px;width:112px;height:66px}}
.memo{font-style:italic;color:var(--muted);font-size:14px;margin-top:4px}
.toast{position:fixed;left:50%;bottom:calc(20px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .25s ease;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.hidden{display:none!important}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-8px)}}
.ico{width:20px;height:20px;flex:0 0 auto;color:var(--brand);stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.cat .ico{width:28px;height:28px}
.chips .ico{width:18px;height:18px;margin-right:4px}
.item .ico{width:22px;height:22px}
.legend .ico{width:16px;height:16px;vertical-align:-3px}
.hero-art .art{margin:0 0 12px}
.intro{max-width:460px;margin:0 auto;text-align:center;padding-top:6px}
.intro .art{max-width:340px;margin:0 auto 14px;box-shadow:0 10px 30px rgba(42,157,143,.2)}
.intro-title{font-size:26px;font-weight:800;margin:4px 0 2px}
.langs{display:grid;gap:12px;margin-top:18px}
.langcard{display:flex;align-items:center;gap:14px;background:#fff;border:2px solid var(--line);border-radius:18px;padding:16px;min-height:72px;font:inherit;font-size:18px;cursor:pointer;text-align:left;box-shadow:0 2px 10px rgba(0,0,0,.06);transition:transform .15s ease,border-color .15s ease}
.langcard:hover{border-color:var(--brand)}
.langcard:active{transform:scale(.98)}
.flag{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex:0 0 auto}
.dots{display:flex;gap:8px;justify-content:center;margin:0 0 12px}
.dots i{width:10px;height:10px;border-radius:999px;background:var(--line);transition:width .25s ease}
.dots i.on{background:var(--brand);width:26px}
.intro-nav{justify-content:center;margin-top:18px}
.intro-nav .btn{min-width:130px}
.linkbtn{background:none;border:0;color:var(--muted);font:inherit;cursor:pointer;margin-top:10px;min-height:44px;text-decoration:underline}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ===== colorful theme (v2) ===== */
.hbar .fxbtn{margin-left:auto;font-size:13px;min-width:0}
#langbtn{margin-left:0}
.tpl-row{display:flex;gap:8px;flex-wrap:wrap}
.tpl-row .btn{flex:1 1 130px;min-height:52px;background:#fff;color:var(--grape);box-shadow:inset 0 0 0 2px #e4dcff}
.tpl-row .btn:hover{background:#faf8ff}
.bk-nudge{margin-top:10px;background:#eef9f5;border-radius:12px;padding:10px;font-size:14px}
:root{--pink:#ff5d8f;--sun:#ffb81c;--mint:#18b89a;--sky:#3b8ee8;--grape:#7b5cf0;--peach:#ff8a5b}
body{background:
  radial-gradient(900px 500px at 8% -10%,rgba(255,93,143,.16),transparent 60%),
  radial-gradient(800px 480px at 100% 0%,rgba(59,142,232,.18),transparent 60%),
  radial-gradient(700px 500px at 50% 110%,rgba(255,184,28,.16),transparent 60%),
  #f7f5ff}
header{background:linear-gradient(120deg,var(--mint) 0%,var(--sky) 45%,var(--grape) 80%,var(--pink) 100%);box-shadow:0 6px 20px rgba(123,92,240,.35)}
header h1{text-shadow:0 2px 0 rgba(0,0,0,.12)}
.card{border:2px solid #fff;box-shadow:0 6px 18px rgba(92,70,200,.10)}
.btn{background:linear-gradient(120deg,var(--mint),var(--sky));box-shadow:0 6px 14px rgba(59,142,232,.28)}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:#fff;color:var(--grape);box-shadow:inset 0 0 0 2px #e4dcff}
.btn.ghost:hover{background:#faf8ff}
.daycard{--c:var(--pink);box-shadow:inset 7px 0 0 var(--c),0 6px 16px rgba(92,70,200,.10);background:linear-gradient(90deg,color-mix(in srgb,var(--c) 11%,#fff),#fff 45%)}
.daycard:nth-child(5n+2){--c:var(--sky)}
.daycard:nth-child(5n+3){--c:var(--mint)}
.daycard:nth-child(5n+4){--c:var(--sun)}
.daycard:nth-child(5n+5){--c:var(--grape)}
.daycard:hover{border-color:var(--c)}
.daycard.empty{box-shadow:inset 7px 0 0 var(--warn),0 6px 16px rgba(196,40,63,.08);background:#fff6f8}
.cat{background:#fff;box-shadow:0 3px 8px rgba(92,70,200,.10)}
.cat[data-cat="travel"]{background:#e6f1ff;color:#1f5fb0}
.cat[data-cat="eat"]{background:#ffeef3;color:#b0245a}
.cat[data-cat="shop"]{background:#fff4df;color:#9a5a00}
.cat[data-cat="sight"]{background:#e7fbf6;color:#0f7f68}
.cat[data-cat="temple"]{background:#fbf0ff;color:#7a2fa8}
.cat[data-cat="nature"]{background:#eefbe6;color:#3f7d14}
.cat[data-cat="rest"]{background:#fff0ea;color:#b4441c}
.cat[data-cat="pack"]{background:#f0eeff;color:#4d3fb8}
.cat.on{box-shadow:inset 0 0 0 3px currentColor;transform:translateY(-1px)}
.cat .ci{background:#fff;border-radius:12px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;margin-bottom:2px;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.cat .ci .ico{color:inherit}
.startbar{background:linear-gradient(180deg,rgba(247,245,255,0),#f7f5ff 35%)}
.start-big{background:linear-gradient(120deg,var(--pink) 0%,var(--peach) 45%,var(--sun) 100%);box-shadow:0 12px 26px rgba(255,93,143,.40);text-shadow:0 2px 0 rgba(0,0,0,.12)}
.langcard:hover{border-color:var(--pink)}
.flag{background:linear-gradient(135deg,var(--pink),var(--grape))}
.dots i.on{background:linear-gradient(90deg,var(--pink),var(--sun))}
.budget{background:#f7fbff;border:2px solid #dbe9fb;border-radius:14px;padding:10px;margin-top:10px}
.budget input[type=number]{font:inherit;font-size:16px;padding:8px;border:2px solid var(--line);border-radius:10px;width:140px;min-height:40px}
.budget.over{background:#fff5f6;border-color:#f5c2cb}
.spent-line{font-size:14px;margin-top:6px;color:var(--muted)}
.budget.over .spent-line{color:var(--warn)}
.spend{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:4px}
.spend li{display:flex;gap:8px;align-items:center;background:#fff;border-radius:10px;padding:6px 8px;font-size:14px}
.spend-add{margin-top:8px}
.spend-add input{font:inherit;font-size:15px;padding:8px;border:2px solid var(--line);border-radius:10px;min-height:40px;flex:1 1 120px}
.spend-add .btn{min-height:40px}
</style>
</head>

function daysBetween(start, end){
  const out = [], d = parseD(start), e = parseD(end);
  while (d <= e && out.length < 61){ out.push(isoOf(d)); d.setDate(d.getDate() + 1); }
  return out;
}

function makeStages(start, end){
  const days = daysBetween(start, end);
  const base = (kind, date, items) => ({ id: uid(), kind, date, items, place: '', memo: '', photos: [] });
  const stages = [base('pack', null, PACK_KEYS.map(k => ({ id: uid(), key: k, cat: 'pack', done: false })))];
  days.forEach((iso, i) => stages.push(base(i === days.length - 1 ? 'home' : 'day', iso, [])));
  return stages;
}

  const t = L();

    lines.push(`${stageIcon(st, i)} ${stageTitle(st, i)} — ${stageMeta(st)}${isDone(st) ? ' 🪙' : ''}`);

  try { await dl.save({ filename, data }); notice(lang === 'th' ? 'บันทึกไฟล์แล้ว' : 'File saved'); return true; }
  catch (e) {
    notice(e && e.code === 'declined'
      ? (lang === 'th' ? 'ยกเลิกการบันทึกไฟล์' : 'Save cancelled')

    return false;
  }
}

const A4 = { w: 794, h: 1123, m: 40, px: 2480, py: 3508 }; // A4 at 96 CSS px/in; 2480x3508 px = A4 at 300 dpi
A4.cw = A4.w - A4.m * 2;            // content width
A4.usable = A4.h - A4.m * 2;        // content height per page

async function saveInfoPng(){
  const ig = modal.querySelector('.ig');
  if (!ig) return;
  const css = Array.from(document.querySelectorAll('style')).map(x => x.textContent).join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;');
  // one clone per page, all at the A4 content width and the same font, so measured and rendered layouts match
  const mk = () => {
    const c = ig.cloneNode(true);
    c.querySelector('.ig-actions')?.remove();
    c.setAttribute('xmlns', 'http://www.w3.org/1999/xhtml');
    Object.assign(c.style, { width: A4.cw + 'px', maxWidth: 'none', margin: '0', borderRadius: '0', fontFamily: 'serif' });
    return c;
  };
  const probe = document.createElement('div');
  probe.style.cssText = `position:fixed;left:-99999px;top:0;width:${A4.cw}px;`;
  document.body.appendChild(probe);
  const measure = (c) => { probe.replaceChildren(c); return Math.ceil(c.getBoundingClientRect().height); };
  const toImg = (c, h) => new Promise((res, rej) => {
    const body = new XMLSerializer().serializeToString(c);
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${A4.cw}" height="${h}" viewBox="0 0 ${A4.cw} ${h}"><foreignObject width="${A4.cw}" height="${h}"><style xmlns="http://www.w3.org/1999/xhtml">${css}</style>${body}</foreignObject></svg>`;
    const img = new Image();
    img.onload = () => res(img); img.onerror = rej;
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  });
  const blocksOf = (c) => Array.from(c.querySelectorAll('.ig-hero, .ig-loot, .ig-stop, .ig-end'));
  try {
    const full = mk();
    const H = measure(full);
    const base = full.getBoundingClientRect().top;
    const blocks = blocksOf(full).map(el => { const r = el.getBoundingClientRect(); return { top: r.top - base, bottom: r.bottom - base }; });

    // one A4 page when it scales to >= 70% legibly; otherwise split between cards
    const scale = H <= A4.usable ? 1 : A4.usable / H;
    const single = scale >= 0.7;
    const ranges = [];
    if (single) ranges.push(null);
    else {
      let start = 0;
      for (const bl of blocks){
        if (bl.bottom - start > A4.usable && bl.top > start + 1){ ranges.push([start, bl.top]); start = bl.top; }
      }
      ranges.push([start, H]);
    }

    const K = A4.px / A4.w;
    const files = [];
    for (const range of ranges){
      const canvas = document.createElement('canvas');
      canvas.width = A4.px; canvas.height = A4.py;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
      if (single){
        const sc = scale < 1 ? scale : 1;
        const img = await toImg(full, H);
        ctx.drawImage(img, ((A4.w - A4.cw * sc) / 2) * K, A4.m * K, A4.cw * sc * K, H * sc * K);
      } else {
        const [s, e] = range;
        const c = mk();
        blocksOf(c).forEach((el, k) => { if (blocks[k].top >= e - 1 || blocks[k].bottom <= s + 1) el.remove(); });
        const h = measure(c);
        const img = await toImg(c, h);
        ctx.save();
        ctx.beginPath(); ctx.rect(0, A4.m * K, A4.px, A4.usable * K); ctx.clip();
        ctx.drawImage(img, A4.m * K, A4.m * K, A4.cw * K, h * K);
        ctx.restore();
      }
      files.push(await new Promise((res, rej) => canvas.toBlob(bl => bl ? res(bl) : rej(new Error('png')), 'image/png')));
    }
    const base2 = `travel-quest-${safeName()}-A4`;
    for (let p = 0; p < files.length; p++){
      const name = files.length === 1 ? `${base2}.png` : `${base2}-${p + 1}of${files.length}.png`;
      if (!(await saveFile(name, files[p]))) break;
    }
  } catch (e) {
    notice(lang === 'th' ? 'สร้างรูปไม่ได้ในหน้านี้' : 'Could not create the image here');
  } finally {
    probe.remove();
  }
}

function celebrate(st){
  const t = L(), g = IG[lang];
  const i = S.stages.indexOf(st);
  const doneN = S.stages.filter(isDone).length;
  const victory = doneN === S.stages.length;
  const nextSt = S.stages[i + 1];
  const title = victory ? g.winT : t.coinTitles[Math.floor(Math.random() * t.coinTitles.length)];
  const nextBtn = !victory && nextSt
    ? `<button class="btn" data-act="open-next" data-idx="${i + 1}">${lang === 'th' ? 'เปิดวันถัดไป' : 'Open next day'}</button>`
    : '';
  const infoBtn = victory ? `<button class="btn" data-act="info">${g.infoBtn}</button>` : '';
  const lastBk = +(localStorage.getItem(BKEY) || 0);
  const bkDue = Date.now() - lastBk > 3 * 864e5;
  const bkNote = bkDue ? `<div class="bk-nudge">${lang === 'th' ? '💾 ยังไม่ได้สำรองข้อมูลเกิน 3 วัน แนะนำให้สำรองไว้' : '💾 No backup for 3+ days. Consider backing up.'} <button class="btn ghost small" data-act="backup">${lang === 'th' ? 'สำรองเลย' : 'Back up now'}</button></div>` : '';
  openModal(`
    <div class="pop${victory ? ' champ' : ''}">
      <h2 id="dlg-title">${title}</h2>
      ${victory ? cupSvg() : coinSvg()}
      <div class="muted">${victory ? g.winD : esc(t.coinEarned(i))}</div>
      <div class="stars" aria-hidden="true">${S.stages.map(s => isDone(s) ? '🪙' : '○').join('')}</div>
      <div class="muted">${t.coinsCount(doneN, S.stages.length)}</div>
      ${bkNote}
      <div class="row wrap" style="margin-top:14px">
        <button class="btn ghost grow" data-act="close">${lang === 'th' ? 'ปิด' : 'Close'}</button>
        ${nextBtn}${infoBtn}
      </div>
    </div>`, { center: true });
  modal.querySelector('[data-act="close"]').focus();
  if (!REDUCE){
    sfx(victory ? 'champ' : 'coin');
    burst(victory ? 260 : 110);
    if (victory){ setTimeout(() => burst(200), 350); setTimeout(() => burst(200), 800); }
  }
  try { fxOn() && navigator.vibrate && navigator.vibrate(victory ? [60, 60, 120, 60, 200] : [30, 40, 80]); } catch(e){}
}

function openStage(sid){

function emptyStages(){ return S.stages.map((st, i) => ({ st, i })).filter(x => !x.st.items.length); }

const TPL = {
  beach:    { th:'🏖️ ทะเล',   en:'🏖️ Beach',    pack:[['ชุดว่ายน้ำ','Swimsuit'],['ครีมกันแดด','Sunscreen'],['แว่นกันแดด','Sunglasses']],
              day:[['เดินเล่นชายหาด','Beach walk','sight'],['ดำน้ำตื้น','Snorkeling','sight'],['อาหารทะเลสด','Fresh seafood','eat']] },
  city:     { th:'🏙️ เมือง',   en:'🏙️ City',     pack:[['รองเท้าเดินสบาย','Comfy shoes'],['แบตสำรอง','Power bank']],
              day:[['ชมวิวจุดเด่น','City viewpoint','sight'],['ช้อปปิ้งตลาด','Market shopping','shop'],['ลองอาหารท้องถิ่น','Local food','eat']] },
  mountain: { th:'⛰️ ภูเขา',   en:'⛰️ Mountain', pack:[['เสื้อกันหนาว','Warm jacket'],['ถุงเท้าสำรอง','Spare socks'],['ยาแก้ปวด','Pain relief']],
              day:[['เดินป่า','Hike','nature'],['ชมวิวยอดเขา','Summit view','sight'],['ถ่ายรูปพาโนรามา','Panorama photo','sight']] },
  business: { th:'💼 ธุรกิจ',  en:'💼 Business', pack:[['บัตรประชาชน','ID card'],['ชุดสูท','Suit'],['เอกสารประชุม','Meeting papers']],
              day:[['ประชุมลูกค้า','Client meeting','travel'],['ดินเนอร์กับทีม','Team dinner','eat'],['ซื้อของฝาก','Souvenirs','shop']] },
};
function applyTemplate(id){
  const tpl = TPL[id]; if (!tpl) return;
  const isTh = lang === 'th';
  let added = 0;
  const addOnce = (st, text, cat) => {
    if (st.items.some(it => itemText(it) === text)) return;
    st.items.push({ id: uid(), text, cat, done: false }); added++;
  };
  S.stages.forEach((st, j) => {
    if (st.kind === 'pack') tpl.pack.forEach(([th, en]) => addOnce(st, isTh ? th : en, 'pack'));
    if (st.kind === 'day'){ const [th, en, cat] = tpl.day[j % tpl.day.length]; addOnce(st, isTh ? th : en, cat); }
  });
  save(); render();
  notice(isTh ? `เพิ่มภารกิจ ${added} รายการ` : `Added ${added} missions`);
}

function fillEmpty(){
  emptyStages().forEach(({ st }) => {
    const idx = S.stages.indexOf(st);
    const key = st.kind === 'pack' ? 'passport' : st.kind === 'home' ? 'goHome' : idx === 1 ? 'goDest' : 'sightsee';
    st.items.push({ id: uid(), key, cat: st.kind === 'pack' ? 'pack' : key === 'sightsee' ? 'sight' : 'travel', done: false });
  });
  save(); render();
}

function startGame(){
  const empty = emptyStages();
  if (empty.length){
    document.getElementById('starterr').textContent = L().emptyDays(empty.map(x => stageTitle(x.st, x.i)).join(', '));
    document.getElementById('fillbtn').classList.remove('hidden');
    document.querySelector(`[data-sid="${empty[0].st.id}"]`)?.scrollIntoView?.({ block: 'center' });
    return;
  }
  S.phase = 'play';
  const cur = firstOpen();
  openSid = cur >= 0 ? S.stages[cur].id : null;
  save(); render();
  window.scrollTo?.(0, 0);
}

function shrinkImage(file){
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 900, s = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', 0.72));
      };
      img.onerror = reject; img.src = fr.result;
    };
    fr.onerror = reject; fr.readAsDataURL(file);
  });
}

async function addPhotos(sid, files){
  const t = L();
  const st = findStage(sid);
  for (const f of files){
    if (st.photos.length >= MAX_PHOTOS){ notice(t.photoMax); break; }
    if (!f.type.startsWith('image/')) continue;
    try {
      const url = await shrinkImage(f);
      st.photos.push(url);
      if (!save()){ st.photos.pop(); notice(t.photoErr); break; }
    } catch(e){ notice(t.photoErr); break; }
  }
  render();
}

document.addEventListener('click', e => {
  if (e.target === modal) return closeModal();
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const a = el.dataset.act, sid = el.dataset.sid;
  const t = L();

  if (a === 'pick-lang'){ lang = el.dataset.lang; try { localStorage.setItem(LKEY, lang); } catch(e){} introStep = 1; render(); return; }
  if (a === 'tour-next'){ if (introStep >= INTRO[lang].slides.length) return finishTour(); introStep++; render(); return; }
  if (a === 'tour-prev'){ if (introStep > 1) introStep--; render(); return; }
  if (a === 'tour-skip') return finishTour();
  if (a === 'tour'){ introMode = 'tour'; introStep = 1; render(); return; }
  if (a === 'lang'){ lang = lang === 'th' ? 'en' : 'th'; try { localStorage.setItem(LKEY, lang); } catch(e){} render(); if (editor.sid) renderEditor(); return; }
  if (a === 'close') return closeModal();
  if (a === 'reset') return askReset();
  if (a === 'reset-yes'){ try { localStorage.removeItem(KEY); } catch(e){} S = null; openSid = null; closeModal(); window.scrollTo?.(0, 0); return; }
  if (a === 'edit') return openEditor(sid);
  if (a === 'cat'){ editor.cat = el.dataset.cat; renderEditor(); return; }
  if (a === 'sug') return addItem(el.dataset.text);
  if (a === 'add-item') return addItem(document.getElementById('ed-input')?.value);
  if (a === 'del'){
    const st = findStage(sid);
    st.items = st.items.filter(x => x.id !== el.dataset.iid);
    save(); renderEditor(); render(); return;
  }
  if (a === 'fill') return fillEmpty();
  if (a === 'spend-add'){
    const st = findStage(sid);
    const amt = Math.round(Number(document.getElementById('sa-' + sid)?.value));
    const note = (document.getElementById('sn-' + sid)?.value || '').trim().slice(0, 60);
    if (!st || !(amt > 0)){ notice(lang === 'th' ? 'ใส่จำนวนเงินให้ถูกต้อง' : 'Enter a valid amount'); return; }
    st.spend = spendOf(st).concat({ id: uid(), amt, note });
    save(); render(); return;
  }
  if (a === 'spend-del'){
    const st = findStage(sid);
    if (st) st.spend = spendOf(st).filter(x => x.id !== el.dataset.eid);
    save(); render(); return;
  }
  if (a === 'fx'){ try { localStorage.setItem(FXKEY, fxOn() ? '0' : '1'); } catch(e){} render(); return; }
  if (a === 'tpl') return applyTemplate(el.dataset.tpl);
  if (a === 'start') return startGame();
  if (a === 'plan'){ S.phase = 'plan'; save(); render(); window.scrollTo?.(0, 0); return; }
  if (a === 'open') return openStage(sid);
  if (a === 'open-next'){ const nx = S.stages[Number(el.dataset.idx)]; closeModal(); if (nx){ openSid = nx.id; render(); } return; }
  if (a === 'info') return openInfo();
  if (a === 'backup') return openBackup();
  if (a === 'import') return openImport();
  if (a === 'import-go') return importGo();
  if (a === 'dl-info') return downloadInfo();
  if (a === 'png-info') return saveInfoPng();
  if (a === 'copy-text' || a === 'copy-backup'){
    const text = a === 'copy-text' ? plainText() : document.getElementById('bk').value;
    const ok = () => { if (a === 'copy-backup') { try { localStorage.setItem(BKEY, String(Date.now())); } catch(e){} } notice(t.copied); };
    if (navigator.clipboard?.writeText){ navigator.clipboard.writeText(text).then(ok, () => { const ta = document.getElementById('bk'); if (ta) { ta.select(); } notice(t.copyFail); }); }
    else { const ta = document.getElementById('bk'); if (ta) { ta.select(); } notice(t.copyFail); }
    return;
  }
  if (a === 'rmphoto'){
    const st = findStage(sid);
    st.photos.splice(Number(el.dataset.idx), 1);
    save(); render(); return;
  }
  if (a === 'check'){
    const st = findStage(sid);
    const it = st.items.find(x => x.id === el.dataset.iid);
    const before = isDone(st);
    it.done = !it.done;
    save(); render();
    if (!before && isDone(st)) celebrate(st); else if (it.done) sfx('tick');
  }
});

document.addEventListener('change', e => {

  if (f.matches?.('input[type=file][data-photo-sid]')){

document.addEventListener('submit', e => {
  if (e.target.id !== 'setup') return;
  e.preventDefault();
  const t = L();
  const f = new FormData(e.target);
  const name = String(f.get('name') || '').trim();
  const start = f.get('start'), end = f.get('end');
  const err = document.getElementById('err');
  if (!start || !end){ err.textContent = t.errDates; return; }
  if (end < start){ err.textContent = t.errOrder; return; }

  S = { trip: { name: name || t.defaultTrip, start, end }, phase: 'plan', guideSeen: false, stages: makeStages(start, end) };
  openSid = null; save(); render(); window.scrollTo?.(0, 0);
});

/* ================= confetti ================= */
const cv = document.getElementById('fx');
const cx = cv.getContext('2d');
let P = [], raf = 0;
function sizeCanvas(){ const dpr = window.devicePixelRatio || 1; cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; cx.setTransform(dpr, 0, 0, dpr, 0, 0); }
addEventListener('resize', sizeCanvas); sizeCanvas();
/* sound effects: synthesized with WebAudio, no audio files; follows the effects switch */
let ac = null;
function sfx(kind){
  if (!fxOn()) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    const t0 = ac.currentTime;
    const tone = (f, at, dur, type, vol) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t0 + at);
      g.gain.setValueAtTime(0.0001, t0 + at);
      g.gain.exponentialRampToValueAtTime(vol, t0 + at + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + at + dur);
      o.connect(g).connect(ac.destination);
      o.start(t0 + at); o.stop(t0 + at + dur + 0.02);
    };
    if (kind === 'tick'){ tone(740, 0, 0.07, 'triangle', 0.14); }
    else if (kind === 'coin'){ tone(988, 0, 0.12, 'square', 0.06); tone(1319, 0.07, 0.28, 'square', 0.06); }
    else if (kind === 'champ'){
      [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.14, 0.32, 'triangle', 0.12));
      tone(1047, 0.6, 0.9, 'sine', 0.12); tone(784, 0.6, 0.9, 'sine', 0.08);
    }
  } catch (e) {}
}
function burst(n){
  if (!fxOn()) return;
  for (let i = 0; i < n; i++) P.push({ x: innerWidth / 2, y: innerHeight * 0.35, vx: (Math.random() - .5) * 14, vy: -Math.random() * 14 - 4, s: 4 + Math.random() * 6, c: COLORS[i % COLORS.length], r: Math.random() * 6, vr: (Math.random() - .5) * .3, t: 0 });
  if (!raf) loop();
}
function loop(){
  cx.clearRect(0, 0, innerWidth, innerHeight);
  P.forEach(p => { p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.t++;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.globalAlpha = Math.max(0, 1 - p.t / 160); cx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); cx.restore(); });
  P = P.filter(p => p.t < 160 && p.y < innerHeight + 20);
  raf = P.length ? requestAnimationFrame(loop) : 0;
}

render();
